services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://recon:recon@db:5432/recon
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:-dev-reviewer-key}   # dev default only; set your own
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}                 # leave both keys empty = rule-based suggestions
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}                           # optional: anthropic | gemini | rule_based
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["4200:80"]
volumes:
  pgdata:
