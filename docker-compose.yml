services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://recon:recon@db:5432/recon
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["4200:80"]
volumes:
  pgdata:
